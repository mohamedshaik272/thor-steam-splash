<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>Now Playing</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .layer { position: fixed; inset: 0; transition: opacity 0.8s ease; }
  #bg { background: center / cover no-repeat; transform: scale(1.06); filter: brightness(0.55); }
  #shade { background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 55%, rgba(0,0,0,0.35) 100%); }
  #game { display: flex; flex-direction: column; justify-content: flex-end; padding: 6vh 6vw; gap: 3vh; }
  #logo { max-width: 78vw; max-height: 34vh; object-fit: contain; object-position: left bottom;
    filter: drop-shadow(0 6px 24px rgba(0,0,0,0.6)); }
  #title { font-size: 9vw; font-weight: 800; line-height: 1.05; display: none; }
  .meta { display: flex; justify-content: space-between; align-items: baseline;
    font-size: 4.2vw; color: rgba(255,255,255,0.78); font-variant-numeric: tabular-nums; }
  #idle { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; }
  #idle .clock { font-size: 22vw; font-weight: 700; font-variant-numeric: tabular-nums; }
  #idle .sub { font-size: 4vw; color: rgba(255,255,255,0.55); }
  .hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="bg" class="layer hidden"></div>
<div id="shade" class="layer hidden"></div>
<div id="game" class="layer hidden">
  <img id="logo" alt="">
  <div id="title"></div>
  <div class="meta"><span id="elapsed"></span><span class="clock"></span></div>
</div>
<div id="idle" class="layer hidden">
  <div class="clock"></div>
  <div class="sub" id="status">Waiting for a game</div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let current = null;
let since = 0;

function show(gameVisible) {
  for (const id of ["bg", "shade", "game"]) $(id).classList.toggle("hidden", !gameVisible);
  $("idle").classList.toggle("hidden", gameVisible);
}

function preload(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(url);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

async function setGame(data) {
  current = data.appid;
  since = data.since * 1000;
  const hero = (await preload(data.hero)) || (await preload(data.header));
  const logo = await preload(data.logo);
  if (current !== data.appid) return;
  $("bg").style.backgroundImage = hero ? `url("${hero}")` : "none";
  $("logo").style.display = logo ? "block" : "none";
  if (logo) $("logo").src = logo;
  $("title").textContent = data.name;
  $("title").style.display = logo ? "none" : "block";
  document.title = data.name;
  show(true);
}

async function poll() {
  try {
    const res = await fetch("/api/now", { cache: "no-store" });
    const data = await res.json();
    $("status").textContent = "Waiting for a game";
    if (!data.appid) {
      if (current !== 0) { current = 0; document.title = "Now Playing"; show(false); }
    } else if (data.appid !== current) {
      await setGame(data);
    }
  } catch {
    $("status").textContent = "Waiting for stream";
    if (current !== 0) { current = 0; show(false); }
  }
}

function tick() {
  const now = new Date();
  const clock = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  for (const el of document.querySelectorAll(".clock")) el.textContent = clock;
  if (current) {
    const mins = Math.floor((Date.now() - since) / 60000);
    const h = Math.floor(mins / 60);
    $("elapsed").textContent = h ? `${h}h ${mins % 60}m this session` : `${mins}m this session`;
  }
}

show(false);
tick();
poll();
setInterval(poll, 2000);
setInterval(tick, 1000);
</script>
</body>
</html>
